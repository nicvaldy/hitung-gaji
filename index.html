<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitung Gaji</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 400px; margin: 40px auto; padding: 0 16px; }
  input, button { width: 100%; padding: 14px; font-size: 18px; border-radius: 10px; box-sizing: border-box; }
  input { border: 1px solid #ccc; margin-bottom: 12px; }
  button { background: #0088cc; color: white; border: none; font-weight: bold; }
  .hasil { margin-top: 20px; }
  .item { display: flex; justify-content: space-between; padding: 12px; background: #f5f5f5; border-radius: 10px; margin-bottom: 8px; }
</style>
</head>
<body>
  <h2>💰 Hitung Gaji</h2>
  <input type="number" id="gaji" placeholder="Masukkan gaji, contoh: 5000000">
  <button onclick="hitung()">Hitung</button>
  <div class="hasil" id="hasil"></div>

<script>
function formatRp(n) {
  return "Rp " + n.toLocaleString("id-ID");
}

function hitung() {
  const gaji = parseFloat(document.getElementById("gaji").value);
  if (!gaji || gaji <= 0) {
    document.getElementById("hasil").innerHTML = "<p>⚠️ Masukkan angka gaji dulu ya</p>";
    return;
  }
  const data = [
    ["🍜 Uang Makan", gaji * 0.25],
    ["🛒 Kebutuhan Pokok", gaji * 0.35],
    ["📈 Investasi", gaji * 0.30],
    ["🎉 Uang Bebas", gaji * 0.05],
  ];
  let html = data.map(([nama, nilai]) =>
    `<div class="item"><span>${nama}</span><b>${formatRp(nilai)}</b></div>`
  ).join("");
  html += `<p>📊 Total terbagi: <b>${formatRp(data.reduce((a, b) => a + b[1], 0))}</b></p>`;
  document.getElementById("hasil").innerHTML = html;
}
</script>
</body>
</html>
